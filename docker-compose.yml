services:
  mongo:
    image: mongo:7
    container_name: trago-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - trago_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # API Express (equivalente a Todo_pwa/server)
  api:
    image: node:20-alpine
    container_name: trago-api
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./server:/app
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Host 4001: en Mac el 4000 suele estar ocupado por Todo_pwa
      - "4001:4000"
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/trago
      MONGODB_DB: trago
      JWT_SECRET: trago-docker-jwt-dev
    restart: unless-stopped

  # Front Vite (build local → dist). Antes: imagen Next legacy.
  # Actualizar: cd trago_web && npm run build && docker compose up -d trago
  trago:
    image: nginx:1.27-alpine
    container_name: trago
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./trago_web/dist:/usr/share/nginx/html:ro
      - ./trago_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  trago_mongo:
