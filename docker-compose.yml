services:
  mongo:
    image: mongo:7
    container_name: trago-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - trago_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # API Express (equivalente a Todo_pwa/server)
  api:
    image: node:20-alpine
    container_name: trago-api
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./server:/app
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/trago
      MONGODB_DB: trago
      JWT_SECRET: trago-docker-jwt-dev
    restart: unless-stopped

volumes:
  trago_mongo:
