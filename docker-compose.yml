services:
  mongo:
    image: mongo:7
    container_name: trago-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - trago_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  trago:
    build:
      context: .
      dockerfile: Dockerfile
    image: trago:latest
    container_name: trago
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      # Dentro de la red Docker el host es "mongo", no el de .env local
      MONGODB_URI: mongodb://mongo:27017/trago
      MONGODB_DB: trago
      AUTH_COOKIE_SECURE: "false"
      APP_ORIGIN: http://localhost:3000
    restart: unless-stopped

volumes:
  trago_mongo:
