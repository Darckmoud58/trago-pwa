services:
  mongo:
    image: mongo:7
    container_name: trago-mongo
    restart: unless-stopped
    # Solo localhost (no 0.0.0.0). Para auth: define MONGO_INITDB_ROOT_USERNAME/PASSWORD en .env
    # y descomenta el bloque environment abajo.
    ports:
      - "127.0.0.1:27018:27017"
    # environment:
    #   MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
    #   MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
    volumes:
      - trago_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  # API Express (equivalente a Todo_pwa/server)
  api:
    image: node:20-alpine
    container_name: trago-api
    working_dir: /app
    command: sh -c "npm install && npm start"
    volumes:
      - ./server:/app
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # Unificado con local / Vite proxy. Override: TRAGO_API_HOST_PORT=4001
      - "${TRAGO_API_HOST_PORT:-4000}:4000"
    environment:
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/trago
      MONGODB_DB: trago
      # ≥32 chars · override with JWT_SECRET in .env (never use in production)
      JWT_SECRET: "${JWT_SECRET:-trago-docker-dev-secret-min-32-chars!!}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}"
    restart: unless-stopped

  # Front Vite (build local → dist). Antes: imagen Next legacy.
  # Actualizar: cd trago_web && npm run build && docker compose up -d trago
  trago:
    image: nginx:1.27-alpine
    container_name: trago
    depends_on:
      - api
    ports:
      - "3000:80"
    volumes:
      - ./trago_web/dist:/usr/share/nginx/html:ro
      - ./trago_web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  trago_mongo:
