# Base = front Vite (como Todo_pwa/todo_pwaa)
[build]
  base = "trago_web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Define en Site settings:
  #   VITE_API_URL=https://TU-API-PUBLICA

# SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
