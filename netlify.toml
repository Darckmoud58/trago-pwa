# Base = front Vite (como Todo_pwa/todo_pwaa)
[build]
  base = "trago_web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Define en Site settings:
  #   VITE_API_URL=https://TU-API-PUBLICA

# SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Iconos PWA: no cachear eternamente (iOS/Android suelen quedarse con la versión vieja)
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
