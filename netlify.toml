# Front Vite + API Express vía Netlify Function (mismo origen /api/*)
[build]
  command = "npm install && npm install --prefix server && npm install --prefix trago_web && npm run build --prefix trago_web"
  publish = "trago_web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Mismo origen: el front llama /api/* → Function (no localhost)
  VITE_API_URL = ""

[functions]
  node_bundler = "esbuild"
  included_files = ["server/src/**"]

# API antes que el SPA fallback
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Iconos PWA: no cachear eternamente (iOS/Android suelen quedarse con la versión vieja)
[[headers]]
  for = "/icon-*.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/apple-touch-icon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
