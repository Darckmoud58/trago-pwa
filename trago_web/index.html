<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- El manifest usa icon-192-vN.png (ICON_VERSION), sin query. -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3B0B13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TraGo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Promociones vigentes cerca de ti en Guadalajara: qué sigue activo, en qué sucursal y a cuántos metros."
    />
    <meta property="og:title" content="TraGo" />
    <meta
      property="og:description"
      content="Promociones vigentes cerca de ti en Guadalajara: qué sigue activo, en qué sucursal y a cuántos metros."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TraGo</title>
    <!-- Tema noche antes del splash (hora México), evita flash blanco. -->
    <script>
      (function () {
        try {
          var hour = Number(
            new Intl.DateTimeFormat('en-GB', {
              timeZone: 'America/Mexico_City',
              hour: '2-digit',
              hourCycle: 'h23',
            })
              .formatToParts(new Date())
              .find(function (p) {
                return p.type === 'hour';
              }).value
          );
          if (hour >= 19 || hour < 6) {
            document.documentElement.setAttribute('data-theme', 'night');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
            var bar = document.querySelector(
              'meta[name="apple-mobile-web-app-status-bar-style"]'
            );
            if (bar) bar.setAttribute('content', 'black');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!--
      Solo en el dev server (:5173) un service worker viejo deja la pantalla
      en blanco. Se da de baja una vez. El preview (:4173) y producción
      conservan el SW: sin él Chrome no instala la app.
    -->
    <script>
      (function () {
        var host = location.hostname;
        if (host !== 'localhost' && host !== '127.0.0.1') return;
        if (location.port !== '5173') return;
        if (!('serviceWorker' in navigator)) return;
        if (sessionStorage.getItem('trago_dev_sw_cleared') === '1') return;
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          if (!regs.length) return;
          sessionStorage.setItem('trago_dev_sw_cleared', '1');
          return Promise.all(
            regs.map(function (reg) {
              return reg.unregister();
            })
          )
            .then(function () {
              return caches.keys();
            })
            .then(function (keys) {
              return Promise.all(
                keys.map(function (key) {
                  return caches.delete(key);
                })
              );
            })
            .then(function () {
              location.reload();
            });
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
