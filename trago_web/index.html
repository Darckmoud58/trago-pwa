<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png?v=2" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3B0B13" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TraGo" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="TraGo — promociones vigentes en Guadalajara. Cuenta desde 13 años. Alcohol solo 18+."
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <title>TraGo</title>
    <!-- Tema noche antes del splash (hora México), evita flash blanco. -->
    <script>
      (function () {
        try {
          var hour = Number(
            new Intl.DateTimeFormat('en-GB', {
              timeZone: 'America/Mexico_City',
              hour: '2-digit',
              hourCycle: 'h23',
            })
              .formatToParts(new Date())
              .find(function (p) {
                return p.type === 'hour';
              }).value
          );
          if (hour >= 19 || hour < 6) {
            document.documentElement.setAttribute('data-theme', 'night');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#000000');
            var bar = document.querySelector(
              'meta[name="apple-mobile-web-app-status-bar-style"]'
            );
            if (bar) bar.setAttribute('content', 'black');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
