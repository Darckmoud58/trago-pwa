server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA React Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|mp4|woff2|webmanifest)$ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
